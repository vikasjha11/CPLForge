<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CPL Cross Compiler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #060610;
      --bg-1: #0b0b1c;
      --bg-2: #111128;
      --bg-3: #181832;
      --border: #1e1e3a;
      --border-bright: #2e2e54;
      --text-1: #e8e8ff;
      --text-2: #8888bb;
      --text-3: #44446a;
      --accent: #6c63ff;
      --accent-dim: #3d37aa;
      --accent-glow: rgba(108,99,255,0.18);
      --success: #3ddc84;
      --success-dim: #1a4a30;
      --error: #ff5c72;
      --error-dim: #3a1020;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg-0);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px);
      pointer-events: none;
      z-index: 1000;
    }

    /* HEADER */
    header {
      background: var(--bg-1); padding: 0 28px; height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px;
      flex-shrink: 0; position: relative;
    }
    header::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.35;
    }
    .logo {
      width: 32px; height: 32px; border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 800; color: white;
      flex-shrink: 0; box-shadow: 0 0 16px var(--accent-glow);
    }
    .header-brand { display: flex; flex-direction: column; gap: 1px; }
    .header-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; }
    .header-sub   { font-size: 10px; color: var(--text-3); letter-spacing: 0.08em; }
    .header-divider { width: 1px; height: 28px; background: var(--border); flex-shrink: 0; }
    .header-meta { display: flex; gap: 8px; align-items: center; }
    .meta-chip {
      font-size: 10px; color: var(--text-3);
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: 4px; padding: 3px 8px; letter-spacing: 0.06em;
    }
    .header-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
    #status-badge {
      display: none; border-radius: 5px; padding: 4px 12px;
      font-size: 11px; font-weight: 500; letter-spacing: 0.04em;
    }
    .badge-ok  { background: var(--success-dim); color: var(--success); border: 1px solid #2a5a3a; }
    .badge-err { background: var(--error-dim);   color: var(--error);   border: 1px solid #5a1a28; }
    #compile-btn {
      background: var(--accent); color: white; border: none; border-radius: 7px;
      padding: 8px 20px; font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em;
      transition: background .15s, box-shadow .15s, transform .1s;
      box-shadow: 0 0 20px rgba(108,99,255,0.3);
    }
    #compile-btn:hover:not(:disabled) { background: #7c74ff; box-shadow: 0 0 28px rgba(108,99,255,0.5); transform: translateY(-1px); }
    #compile-btn:active:not(:disabled) { transform: translateY(0); }
    #compile-btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

    /* MAIN LAYOUT */
    main { display: grid; grid-template-columns: 380px 1fr; flex: 1; overflow: hidden; min-height: 0; }
    .panel { overflow-y: auto; }
    .panel::-webkit-scrollbar { width: 4px; }
    .panel::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }
    .panel-left { border-right: 1px solid var(--border); background: var(--bg-1); display: flex; flex-direction: column; }
    .panel-section { padding: 18px 20px; border-bottom: 1px solid var(--border); }
    .panel-section:last-child { border-bottom: none; flex: 1; }
    .panel-right { display: flex; flex-direction: column; background: var(--bg-0); }

    .section-label {
      font-size: 9px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.14em; color: var(--text-3); margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ─── FEATURE 1: SAMPLE PROGRAMS LIBRARY ─── */
    .sample-bar { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    #sample-select {
      flex: 1; background: var(--bg-3); color: var(--text-2);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px; font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px; cursor: pointer; outline: none; transition: border-color .2s;
    }
    #sample-select:hover, #sample-select:focus { border-color: var(--accent); color: var(--text-1); }
    #load-sample-btn {
      background: var(--bg-3); color: var(--text-2); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 12px; font-size: 10.5px; cursor: pointer;
      font-family: 'JetBrains Mono', monospace; white-space: nowrap; transition: all .15s;
    }
    #load-sample-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

    /* EDITOR */
    .editor-wrap {
      border-radius: 8px; overflow: hidden; border: 1px solid var(--border);
      transition: border-color .2s; position: relative;
    }
    .editor-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    /* ─── FEATURE 2: ERROR HIGHLIGHT STATE ─── */
    .editor-wrap.has-error { border-color: var(--error) !important; box-shadow: 0 0 0 3px rgba(255,92,114,0.15) !important; }
    .editor-topbar {
      background: var(--bg-2); padding: 8px 14px;
      display: flex; align-items: center; gap: 6px;
      border-bottom: 1px solid var(--border);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    #code-editor {
      background: var(--bg-2); color: var(--text-1); border: none;
      padding: 14px; font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px; line-height: 1.75; resize: none; width: 100%;
      height: 220px; outline: none;
    }
    #code-editor::selection { background: rgba(108,99,255,0.25); }
    #editor-error-overlay {
      position: absolute; left: 0; right: 0; pointer-events: none;
      background: rgba(255,92,114,0.08); border-left: 3px solid var(--error); display: none;
    }
    #editor-inline-error {
      font-size: 10px; color: var(--error); padding: 5px 14px 6px;
      background: rgba(58,16,32,0.95); border-top: 1px solid #5a1a28;
      display: none; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    #editor-inline-error::before { content: '⚠  '; }

    /* PIPELINE */
    #pipeline { display: flex; flex-direction: column; gap: 5px; }
    .stage-pill {
      display: flex; align-items: center; gap: 12px;
      background: var(--bg-0); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 12px; cursor: default;
      transition: border-color .3s, background .3s, opacity .3s;
      position: relative; overflow: hidden;
    }
    .stage-pill::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      border-radius: 3px 0 0 3px; background: transparent; transition: background .3s;
    }
    .stage-pill.done::before, .stage-pill.active::before { background: var(--sc); }
    .stage-pill.done { cursor: pointer; }
    .stage-pill.done:hover { border-color: var(--border-bright); background: var(--bg-2); }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    .stage-pill.active {
      background: linear-gradient(90deg, var(--bg-1) 25%, var(--bg-2) 50%, var(--bg-1) 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite; border-color: var(--border-bright);
    }
    .stage-icon {
      width: 30px; height: 30px; border-radius: 6px; background: var(--bg-3);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: white; flex-shrink: 0;
      transition: background .3s; font-family: 'Syne', sans-serif;
    }
    .stage-text { flex: 1; min-width: 0; }
    .stage-name { font-size: 12px; font-weight: 500; color: var(--text-2); transition: color .3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stage-desc { font-size: 10px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stage-status { display: flex; align-items: center; width: 16px; flex-shrink: 0; justify-content: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 14px; height: 14px; border: 1.5px solid transparent; border-radius: 50%; animation: spin .65s linear infinite; display: none; }
    .stage-pill.active .spinner { display: block; }
    .check-icon, .fail-icon { font-size: 12px; display: none; }
    .stage-pill.done   .check-icon { display: block; color: var(--success); }
    .stage-pill.failed .fail-icon  { display: block; color: var(--error);   }

    /* OUTPUT HEADER */
    .output-header {
      background: var(--bg-1); border-bottom: 1px solid var(--border);
      padding: 0 20px; display: flex; align-items: center; gap: 2px;
      height: 44px; flex-shrink: 0; overflow-x: auto;
    }
    .tab-btn {
      background: none; border: none; cursor: pointer; padding: 6px 14px;
      font-size: 11px; border-radius: 6px; color: var(--text-3);
      font-family: 'JetBrains Mono', monospace; transition: color .15s, background .15s;
      height: 32px; display: flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .tab-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0; transition: opacity .15s; }
    .tab-btn.active .tab-dot { opacity: 1; }
    .tab-btn.active { background: var(--bg-2); color: var(--text-1); border: 1px solid var(--border); }
    .tab-btn:hover:not(.active) { color: var(--text-2); background: var(--bg-2); }

    .output-body { flex: 1; overflow-y: auto; padding: 20px; min-height: 0; }
    .output-body::-webkit-scrollbar { width: 4px; }
    .output-body::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; min-height: 320px; gap: 14px; color: var(--text-3);
    }
    .empty-icon { font-size: 48px; opacity: 0.2; filter: grayscale(1); }
    .empty-title { font-size: 13px; color: var(--text-3); }
    .empty-sub   { font-size: 11px; color: var(--text-3); opacity: 0.6; }

    .compile-log-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; min-height: 320px; gap: 4px;
    }
    .compile-log-title {
      font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
      color: var(--text-2); margin-bottom: 16px; letter-spacing: 0.1em;
    }
    .log-line {
      display: flex; align-items: center; gap: 10px; font-size: 11px;
      padding: 5px 18px; border-radius: 6px; min-width: 300px; transition: background .3s;
    }
    .log-line.log-active { background: rgba(108,99,255,0.07); }
    .log-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      background: var(--border); transition: background .3s;
    }
    .log-dot.spinning {
      background: transparent !important; width: 9px; height: 9px;
      border: 1.5px solid var(--accent); animation: spin .6s linear infinite;
    }
    .log-label { transition: color .3s; }

    .code-box { background: var(--bg-1); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .code-box-header {
      background: var(--bg-2); padding: 8px 14px; border-bottom: 1px solid var(--border);
      font-size: 10px; color: var(--text-3); letter-spacing: 0.08em;
      display: flex; align-items: center; justify-content: space-between;
    }
    .code-box-content {
      padding: 14px; font-size: 11.5px; line-height: 1.7;
      overflow-x: auto; white-space: pre; font-family: 'JetBrains Mono', monospace;
      max-height: 340px; overflow-y: auto; color: #a0ffa0;
    }
    .code-box-content::-webkit-scrollbar { width: 4px; height: 4px; }
    .code-box-content::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

    /* ─── FEATURE 3: TOKEN STREAM ANIMATION ─── */
    .tokens-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
    .token-tag {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 5px; font-size: 10.5px;
      font-family: 'JetBrains Mono', monospace; border: 1px solid transparent;
      opacity: 0; transform: scale(0.7) translateY(4px);
    }
    @keyframes tokenPop {
      0%   { opacity:0; transform: scale(0.7) translateY(6px); }
      60%  { transform: scale(1.06) translateY(-1px); }
      100% { opacity:1; transform: scale(1) translateY(0); }
    }
    .token-tag.tok-visible { animation: tokenPop .2s ease forwards; }
    .token-type { opacity: .6; font-size: 9px; }
    .token-val  { font-weight: 500; }

    table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    thead th {
      padding: 8px 12px; text-align: left; font-weight: 600; font-size: 9px;
      color: var(--text-3); text-transform: uppercase; letter-spacing: 0.1em;
      background: var(--bg-2); border-bottom: 1px solid var(--border);
    }
    tbody td { padding: 7px 12px; border-bottom: 1px solid var(--border); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--bg-2); }

    .tac-line { padding: 2px 0; display: flex; }
    .line-num  { color: var(--text-3); user-select: none; min-width: 42px; flex-shrink: 0; }

    .stats-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat-chip {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 12px; font-size: 10px; color: var(--text-2);
      display: flex; align-items: center; gap: 6px;
    }
    .stat-chip strong { color: var(--text-1); font-size: 13px; }

    /* ─── FEATURE 5: STATS DASHBOARD ─── */
    .stats-dashboard {
      background: var(--bg-1); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px 18px; margin-bottom: 18px; position: relative; overflow: hidden;
    }
    .stats-dashboard::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, #7C3AED, #0EA5E9, #F97316, #EF4444, #10B981, #6366F1);
    }
    .stats-dashboard-title {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--text-3); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .stats-dashboard-title::after { content:''; flex:1; height:1px; background:var(--border); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr)); gap: 10px; }
    .dash-card {
      background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; display: flex; flex-direction: column; gap: 4px;
    }
    .dash-card-label { font-size: 9px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.1em; }
    .dash-card-value { font-size: 18px; font-weight: 700; font-family: 'Syne', sans-serif; color: var(--text-1); }
    .dash-card-sub   { font-size: 9px; color: var(--text-3); }
    .dash-bar-wrap { margin-top: 14px; }
    .dash-bar-label { font-size: 9px; color: var(--text-3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
    .dash-bar-track { background: var(--bg-3); border-radius: 3px; height: 5px; overflow: hidden; }
    .dash-bar-fill { height: 100%; border-radius: 3px; transition: width 1.2s cubic-bezier(.4,0,.2,1); }

    .err-box { background: var(--error-dim); border: 1px solid #5a1a28; border-radius: 8px; padding: 16px; }
    .err-title { color: var(--error); font-weight: 600; font-size: 12px; margin-bottom: 8px; }
    .err-msg   { color: #ff9090; font-size: 11.5px; line-height: 1.6; }

    .opt-banner {
      background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2);
      border-radius: 7px; padding: 10px 14px; font-size: 11px; color: var(--success);
      margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
    }

    .sub-tab-bar { display: flex; gap: 6px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
    .sub-tab {
      background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 12px; font-size: 10.5px; color: var(--text-3); cursor: pointer;
      font-family: 'JetBrains Mono', monospace; transition: all .15s;
    }
    .sub-tab.active { background: var(--bg-3); border-color: var(--accent); color: var(--text-1); }
    .sub-tab:hover:not(.active) { color: var(--text-2); }

    /* ─── FEATURE 4: DOWNLOAD BUTTONS ─── */
    .dl-btn {
      background: var(--bg-3); color: var(--text-2); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 11px; font-size: 10px; cursor: pointer;
      font-family: 'JetBrains Mono', monospace; transition: all .15s;
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .dl-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

    /* ─── FEATURE 6: AST VISUAL TREE ─── */
    #ast-svg-wrap {
      width: 100%; overflow: auto; background: var(--bg-1);
      border: 1px solid var(--border); border-radius: 8px; min-height: 200px;
    }
    #ast-svg-wrap::-webkit-scrollbar { width: 4px; height: 4px; }
    #ast-svg-wrap::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }
    .ast-view-toggle { display: flex; gap: 6px; margin-bottom: 12px; }
    .ast-toggle-btn {
      background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 12px; font-size: 10px; color: var(--text-3); cursor: pointer;
      font-family: 'JetBrains Mono', monospace; transition: all .15s;
    }
    .ast-toggle-btn.active { background: var(--bg-3); border-color: var(--accent); color: var(--text-1); }

    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeUp .25s ease forwards; }
    #left-error { padding: 0 20px 16px; }

    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      .panel-left { border-right: none; border-bottom: 1px solid var(--border); max-height: 60vh; }
      body { overflow: auto; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">C</div>
  <div class="header-brand">
    <div class="header-title">CPL Cross Compiler</div>
    <div class="header-sub">Bootstrap-Enabled Compiler Infrastructure</div>
  </div>
  <div class="header-divider"></div>
  <div class="header-meta">
    <span class="meta-chip">x86 AT&amp;T</span>
    <span class="meta-chip">C99</span>
    <span class="meta-chip">LL(1)</span>
  </div>
  <div class="header-right">
    <span id="status-badge"></span>
    <button id="compile-btn" onclick="compile()">&#9654; Compile</button>
  </div>
</header>

<main>
  <div class="panel panel-left">
    <div class="panel-section">
      <div class="section-label">Source Code</div>

      <!-- FEATURE 1: Sample Programs Library -->
      <div class="sample-bar">
        <select id="sample-select">
          <option value="">&#8212; Load Sample Program &#8212;</option>
          <option value="factorial">Factorial (iterative)</option>
          <option value="fibonacci">Fibonacci sequence</option>
          <option value="bubble_sort">Bubble Sort</option>
          <option value="gcd">GCD (Euclidean)</option>
          <option value="power">Power function</option>
          <option value="sum_loop">Sum 1..N with loop</option>
        </select>
        <button id="load-sample-btn" onclick="loadSample()">&#8595; Load</button>
      </div>

      <div class="editor-wrap" id="editor-wrap">
        <div class="editor-topbar">
          <div class="dot" style="background:#ff5f57"></div>
          <div class="dot" style="background:#febc2e"></div>
          <div class="dot" style="background:#28c840"></div>
          <span style="margin-left:8px;font-size:10px;color:var(--text-3)" id="editor-filename">main.cpl</span>
        </div>
        <!-- FEATURE 2: error overlay (sits inside editor-wrap) -->
        <div id="editor-error-overlay"></div>
        <textarea id="code-editor" spellcheck="false">int a = 5;
int b = 3;
int folded = 100 + 200;
int result = a + b * 2;

if (result > 10) {
    print(result);
} else {
    int x = 0;
    while (x < result) {
        x = x + 1;
    }
    print(x);
}</textarea>
        <div id="editor-inline-error"></div>
      </div>
    </div>

    <div class="panel-section" style="flex:1">
      <div class="section-label">Compilation Pipeline</div>
      <div id="pipeline"></div>
    </div>

    <div id="left-error" style="display:none;"></div>
  </div>

  <div class="panel panel-right">
    <div class="output-header" id="output-tabs" style="display:none;"></div>
    <div class="output-body" id="output-area">
      <div class="empty-state">
        <div class="empty-icon">&#9881;</div>
        <div class="empty-title">No output yet</div>
        <div class="empty-sub">Write CPL code and click Compile</div>
      </div>
    </div>
  </div>
</main>

<script>
/* ═══════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════ */
const STAGES = [
  { id:1, name:"Lexical Analysis",   icon:"L",  desc:"Tokenizes source code into lexemes",             color:"#7C3AED" },
  { id:2, name:"Syntax Analysis",    icon:"P",  desc:"Builds Abstract Syntax Tree via LL(1) parser",  color:"#0EA5E9" },
  { id:3, name:"Semantic Analysis",  icon:"S",  desc:"Type checking and symbol table construction",    color:"#F97316" },
  { id:4, name:"IR Generation",      icon:"IR", desc:"Emits Three Address Code (TAC) instructions",    color:"#EF4444" },
  { id:5, name:"Optimization",       icon:"O",  desc:"Constant folding and dead code elimination",     color:"#10B981" },
  { id:6, name:"Code Generation",    icon:"CG", desc:"Outputs x86 Assembly and C99 target code",       color:"#6366F1" },
];
const STAGE_DELAYS = [380, 520, 600, 460, 400, 480];
const TOKEN_COLORS = {
  KEYWORD:"#7C3AED",INT:"#10B981",FLOAT:"#059669",STRING:"#F97316",
  ID:"#3B82F6",PLUS:"#F59E0B",MINUS:"#F59E0B",MUL:"#F59E0B",DIV:"#F59E0B",
  ASSIGN:"#EC4899",LPAREN:"#6B7280",RPAREN:"#6B7280",LBRACE:"#6B7280",
  RBRACE:"#6B7280",SEMICOLON:"#6B7280",LT:"#EF4444",GT:"#EF4444",EQ:"#EF4444",EOF:"#374151",
};

/* ─── FEATURE 1: Sample programs ─── */
const SAMPLES = {
  factorial:
`int result = 1;
int i = 1;
int n = 10;

while (i < n) {
    result = result * i;
    i = i + 1;
}

print(result);`,

  fibonacci:
`int a = 0;
int b = 1;
int n = 8;
int i = 0;

print(a);
print(b);

while (i < n) {
    int c = a + b;
    print(c);
    a = b;
    b = c;
    i = i + 1;
}`,

  bubble_sort:
`int a = 64;
int b = 34;
int c = 25;
int d = 12;
int e = 22;

if (b < a) {
    int tmp = a;
    a = b;
    b = tmp;
}
if (c < b) {
    int tmp2 = b;
    b = c;
    c = tmp2;
}
if (d < c) {
    int tmp3 = c;
    c = d;
    d = tmp3;
}

print(a);
print(b);
print(c);
print(d);
print(e);`,

  gcd:
`int a = 48;
int b = 18;
int temp = 0;

while (b > 0) {
    temp = b;
    b = a - (a / b) * b;
    a = temp;
}

print(a);`,

  power:
`int base = 2;
int exp = 8;
int result = 1;
int i = 0;

while (i < exp) {
    result = result * base;
    i = i + 1;
}

print(result);`,

  sum_loop:
`int sum = 0;
int i = 1;
int n = 100;

while (i < n) {
    sum = sum + i;
    i = i + 1;
}

print(sum);`,
};

function loadSample() {
  const key = document.getElementById('sample-select').value;
  if (!key || !SAMPLES[key]) return;
  document.getElementById('code-editor').value = SAMPLES[key];
  document.getElementById('editor-filename').textContent = key + '.cpl';
  clearErrorHighlight();
  document.getElementById('sample-select').value = '';
}

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let result = null, selectedView = "tokens", outputTab = "asm", astMode = "tree";

window.onload = () => renderPipeline();

/* ═══════════════════════════════════════════════
   PIPELINE
═══════════════════════════════════════════════ */
function renderPipeline() {
  const pip = document.getElementById("pipeline");
  pip.innerHTML = "";
  STAGES.forEach(s => {
    const sr   = result?.stages?.[String(s.id)];
    const done = sr?.status === "success";
    const fail = sr?.status === "error";
    const desc = (done && sr?.summary) ? sr.summary : s.desc;

    const pill = document.createElement("div");
    pill.className = "stage-pill" + (done ? " done" : fail ? " failed" : "");
    pill.style.setProperty("--sc", s.color);
    pill.id = `pill-${s.id}`;
    if (done) pill.onclick = () => setViewFromStage(s.id);

    pill.innerHTML = `
      <div class="stage-icon" id="sicon-${s.id}" style="${done||fail ? `background:${s.color}22;color:${s.color}` : ''}">${s.icon}</div>
      <div class="stage-text">
        <div class="stage-name" id="sname-${s.id}" style="${done ? `color:${s.color}` : ''}">${s.name}</div>
        <div class="stage-desc" id="sdesc-${s.id}">${esc(desc)}</div>
      </div>
      <div class="stage-status">
        <div class="spinner" style="border:2px solid transparent;border-top-color:${s.color}"></div>
        <span class="check-icon">&#10003;</span>
        <span class="fail-icon">&#10007;</span>
      </div>`;
    pip.appendChild(pill);
  });
}

function setPillState(stageId, state, summary) {
  const pill   = document.getElementById(`pill-${stageId}`);
  const icon   = document.getElementById(`sicon-${stageId}`);
  const nameEl = document.getElementById(`sname-${stageId}`);
  const desc   = document.getElementById(`sdesc-${stageId}`);
  const s      = STAGES[stageId - 1];
  if (!pill) return;
  pill.classList.remove("done","active","failed");
  if (state === "done") {
    pill.classList.add("done");
    pill.style.setProperty("--sc", s.color);
    pill.onclick = () => setViewFromStage(stageId);
    icon.style.background = `${s.color}22`;
    icon.style.color = s.color;
    nameEl.style.color = s.color;
    if (summary) desc.textContent = summary;
  } else if (state === "active") {
    pill.classList.add("active");
    pill.style.setProperty("--sc", s.color);
    nameEl.style.color = "var(--text-1)";
  } else if (state === "failed") {
    pill.classList.add("failed");
    if (summary) desc.textContent = summary;
  } else {
    icon.style.background = "var(--bg-3)";
    nameEl.style.color = "var(--text-2)";
  }
}

/* ─── FEATURE 2: Error Highlight in Editor ─── */
function highlightEditorError(errorMsg) {
  const wrap    = document.getElementById('editor-wrap');
  const overlay = document.getElementById('editor-error-overlay');
  const inline  = document.getElementById('editor-inline-error');
  const editor  = document.getElementById('code-editor');

  wrap.classList.add('has-error');

  const lineMatch = errorMsg.match(/line\s*(\d+)/i);
  if (lineMatch) {
    const lineNum = parseInt(lineMatch[1], 10);
    const lineHt  = 22; // approximate line height px for 12.5px mono font at 1.75
    const padTop  = 14;
    const topbarH = 37;
    const top = topbarH + padTop + (lineNum - 1) * lineHt;
    overlay.style.cssText = `display:block;top:${top}px;height:${lineHt + 2}px;left:0;right:0;position:absolute;background:rgba(255,92,114,0.10);border-left:3px solid var(--error);pointer-events:none;`;
  } else {
    overlay.style.display = 'none';
  }

  inline.style.display = 'block';
  inline.textContent = errorMsg;
}

function clearErrorHighlight() {
  document.getElementById('editor-wrap').classList.remove('has-error');
  document.getElementById('editor-error-overlay').style.display = 'none';
  document.getElementById('editor-inline-error').style.display  = 'none';
  document.getElementById('editor-inline-error').textContent    = '';
}

/* ═══════════════════════════════════════════════
   COMPILE
═══════════════════════════════════════════════ */
async function compile() {
  const code = document.getElementById("code-editor").value.trim();
  if (!code) { alert("The editor is empty. Please write some CPL code first."); return; }

  const btn     = document.getElementById("compile-btn");
  const badge   = document.getElementById("status-badge");
  const outArea = document.getElementById("output-area");
  const outTabs = document.getElementById("output-tabs");

  btn.disabled = true; btn.textContent = "Compiling\u2026";
  badge.style.display = "none";
  result = null; selectedView = "tokens";
  outTabs.style.display = "none";
  document.getElementById("left-error").style.display = "none";
  clearErrorHighlight();

  renderPipeline();
  outArea.innerHTML = buildLog();

  for (let i = 0; i < STAGES.length; i++) {
    const sid = STAGES[i].id;
    setPillState(sid, "active");
    setLogState(sid, "active");
    for (let j = 1; j < sid; j++) setLogState(j, "waiting-done");
    await sleep(STAGE_DELAYS[i]);
  }

  try {
    const res = await fetch("/compile", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code }),
    });
    result = await res.json();

    STAGES.forEach(s => {
      const sr = result.stages?.[String(s.id)];
      if (!sr) return;
      setPillState(s.id, sr.status === "success" ? "done" : "failed", sr.summary);
      setLogState(s.id, sr.status === "success" ? "done" : "failed");
    });

    if (!result.success && result.error) {
      highlightEditorError(result.error);
    }

    renderTabs();
    renderOutput();

    badge.className   = result.success ? "badge-ok" : "badge-err";
    badge.textContent = result.success ? "\u2713 Compiled" : "\u2717 Error";
    badge.style.display = "inline-block";
  } catch (e) {
    showLeftError("Server error: " + e.message);
    outArea.innerHTML = `<div class="empty-state"><div class="empty-icon">&#9888;</div><div class="empty-title">Connection Error</div><div class="empty-sub">${esc(e.message)}</div></div>`;
  }

  btn.disabled = false; btn.textContent = "\u25B6 Compile";
}

function buildLog() {
  let h = `<div class="compile-log-wrap" id="compile-log-wrap"><div class="compile-log-title">COMPILING\u2026</div>`;
  STAGES.forEach(s => {
    h += `<div class="log-line" id="ll-${s.id}"><div class="log-dot" id="ld-${s.id}"></div><span class="log-label" id="lb-${s.id}" style="color:var(--text-3)">\u25CB &nbsp;Stage ${s.id}: ${s.name}</span></div>`;
  });
  return h + `</div>`;
}

function setLogState(sid, state) {
  const dot  = document.getElementById(`ld-${sid}`);
  const lbl  = document.getElementById(`lb-${sid}`);
  const line = document.getElementById(`ll-${sid}`);
  if (!dot) return;
  const s = STAGES[sid - 1];
  dot.classList.remove("spinning");
  if (state === "active") {
    dot.classList.add("spinning"); lbl.style.color = "var(--text-1)";
    lbl.textContent = `\u27F3  Stage ${sid}: ${s.name}`; line.classList.add("log-active");
  } else if (state === "done") {
    dot.style.background = s.color; lbl.style.color = "var(--success)";
    lbl.textContent = `\u2713  Stage ${sid}: ${s.name}`; line.classList.remove("log-active");
  } else if (state === "failed") {
    dot.style.background = "var(--error)"; lbl.style.color = "var(--error)";
    lbl.textContent = `\u2717  Stage ${sid}: ${s.name}`; line.classList.remove("log-active");
  } else if (state === "waiting-done") {
    dot.style.background = s.color; lbl.style.color = "var(--text-3)";
    lbl.textContent = `\u2713  Stage ${sid}: ${s.name}`;
  }
}

/* ═══════════════════════════════════════════════
   TABS
═══════════════════════════════════════════════ */
const TABS = [
  {id:"tokens",    label:"Tokens"},
  {id:"ast",       label:"AST"},
  {id:"symbols",   label:"Symbols"},
  {id:"tac",       label:"TAC"},
  {id:"optimized", label:"Optimized"},
  {id:"output",    label:"Output"},
  {id:"stats",     label:"\u26A1 Stats"},
];

function renderTabs() {
  const bar = document.getElementById("output-tabs");
  bar.style.display = "flex";
  bar.innerHTML = "";
  TABS.forEach(t => {
    if (t.id === "stats" && !result?.success) return;
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (selectedView === t.id ? " active" : "");
    btn.onclick   = () => { selectedView = t.id; renderOutput(); renderTabs(); };
    btn.innerHTML = `<span class="tab-dot"></span>${t.label}`;
    bar.appendChild(btn);
  });
}

function setViewFromStage(sid) {
  const map = {1:"tokens",2:"ast",3:"symbols",4:"tac",5:"optimized",6:"output"};
  selectedView = map[sid] || "tokens";
  renderTabs(); renderOutput();
}

/* ═══════════════════════════════════════════════
   OUTPUT RENDER
═══════════════════════════════════════════════ */
function renderOutput() {
  if (!result) return;
  const sr  = result.stages;
  const out = document.getElementById("output-area");
  let   html = `<div class="fade-in">`;

  /* ─── FEATURE 3: Token stream animation ─── */
  if (selectedView === "tokens" && sr?.["1"]) {
    const t = sr["1"];
    html += statsRow([{label:"Tokens",value:t.tokens?.length??0},{label:"Time",value:ms(t.summary)}]);
    html += `<div class="tokens-wrap" id="tok-wrap">`;
    (t.tokens||[]).forEach((tok, idx) => {
      const bg = TOKEN_COLORS[tok.type] || "#374151";
      html += `<span class="token-tag" style="background:${bg}22;color:${bg};border-color:${bg}44" data-i="${idx}">
        <span class="token-type">${tok.type}</span>
        ${tok.value !== tok.type ? `<span class="token-val">${esc(String(tok.value).slice(0,16))}</span>` : ""}
      </span>`;
    });
    html += `</div>`;
    out.innerHTML = html + errorBox() + `</div>`;
    // Stagger each token into view
    const tags = out.querySelectorAll('.token-tag');
    tags.forEach((el, i) => setTimeout(() => el.classList.add('tok-visible'), i * 30));
    return;
  }

  /* ─── FEATURE 6: AST Visual Tree ─── */
  else if (selectedView === "ast" && sr?.["2"]) {
    const t = sr["2"];
    html += statsRow([{label:"AST Nodes",value:t.ast_nodes},{label:"Time",value:ms(t.summary)}]);
    html += `<div class="ast-view-toggle">
      <button class="ast-toggle-btn ${astMode==='tree'?'active':''}" onclick="setAstMode('tree')">&#128200; Visual Tree</button>
      <button class="ast-toggle-btn ${astMode==='text'?'active':''}" onclick="setAstMode('text')">&#128196; Text View</button>
    </div>`;
    if (astMode === 'tree') {
      const treeRoot = parseAstText(t.ast_preview || "");
      html += `<div id="ast-svg-wrap">${buildAstSvg(treeRoot)}</div>`;
    } else {
      html += codeBox("ABSTRACT SYNTAX TREE", t.ast_preview||"", "#c0b0ff");
    }
  }

  else if (selectedView === "symbols" && sr?.["3"]) {
    const t = sr["3"];
    html += statsRow([{label:"Symbols",value:(t.symbols||[]).length},{label:"Time",value:ms(t.summary)}]);
    if (!(t.symbols||[]).length) {
      html += `<div class="empty-state" style="min-height:180px"><div class="empty-icon" style="font-size:32px">&#8709;</div><div class="empty-title">No symbols declared</div></div>`;
    } else {
      html += `<div class="code-box"><table><thead><tr><th>Identifier</th><th>Type</th><th>Value</th><th>Scope</th></tr></thead><tbody>`;
      t.symbols.forEach(s => {
        html += `<tr><td style="color:#93c5fd;font-weight:500">${esc(s.name)}</td><td style="color:#6ee7b7">${esc(s.type)}</td><td style="color:#fcd34d">${esc(s.value)}</td><td style="color:var(--text-3)">${esc(s.scope)}</td></tr>`;
      });
      html += `</tbody></table></div>`;
    }
  }

  else if (selectedView === "tac" && sr?.["4"]) {
    const t = sr["4"];
    html += statsRow([{label:"Instructions",value:(t.tac||[]).length},{label:"Time",value:ms(t.summary)}]);
    html += `<div class="code-box"><div class="code-box-header"><span>THREE ADDRESS CODE</span><span>${(t.tac||[]).length} lines</span></div><div class="code-box-content">`;
    (t.tac||[]).forEach((line,i) => {
      const c = (line.includes(":") && !line.includes("=")) ? "#93c5fd"
              : (line.startsWith("if")||line.startsWith("goto")) ? "#fcd34d" : "#a7f3d0";
      html += `<div class="tac-line"><span class="line-num">${String(i+1).padStart(3)} \u2502 </span><span style="color:${c}">${esc(line)}</span></div>`;
    });
    html += `</div></div>`;
  }

  else if (selectedView === "optimized" && sr?.["5"]) {
    const t = sr["5"];
    html += statsRow([{label:"Eliminated",value:t.eliminated},{label:"Remaining",value:(t.optimized_tac||[]).length},{label:"Time",value:ms(t.summary)}]);
    if (t.eliminated > 0)
      html += `<div class="opt-banner">&#9889; ${t.eliminated} instruction${t.eliminated>1?"s":""} eliminated by constant folding / dead code elimination</div>`;
    html += `<div class="code-box"><div class="code-box-header"><span>OPTIMIZED TAC</span></div><div class="code-box-content" style="color:#fde68a">`;
    (t.optimized_tac||[]).forEach((line,i) => {
      html += `<div class="tac-line"><span class="line-num">${String(i+1).padStart(3)} \u2502 </span>${esc(line)}</div>`;
    });
    html += `</div></div>`;
  }

  /* ─── FEATURE 4: Download buttons ─── */
  else if (selectedView === "output" && sr?.["6"]) {
    const t = sr["6"];
    html += statsRow([{label:"Target",value:"x86 AT&T + C99"},{label:"Time",value:ms(t.summary)}]);
    html += `<div class="sub-tab-bar">
      <button class="sub-tab ${outputTab==="asm"?"active":""}" onclick="setOutputTab('asm')">x86 Assembly</button>
      <button class="sub-tab ${outputTab==="c"  ?"active":""}" onclick="setOutputTab('c')">C99 Output</button>
      <button class="dl-btn" onclick="downloadOutput('asm')">&#11015; .asm</button>
      <button class="dl-btn" onclick="downloadOutput('c')">&#11015; .c</button>
    </div>`;
    const content = outputTab === "asm" ? t.asm : t.c_code;
    const color   = outputTab === "asm" ? "#a7f3d0" : "#93c5fd";
    const label   = outputTab === "asm" ? "X86 AT&T ASSEMBLY" : "C99 GENERATED CODE";
    html += codeBox(label, content || "", color);
  }

  /* ─── FEATURE 5: Compilation Stats Dashboard ─── */
  else if (selectedView === "stats" && result?.success) {
    html += buildStatsDashboard(sr);
  }

  html += errorBox() + `</div>`;
  out.innerHTML = html;
}

function errorBox() {
  if (!result?.error) return '';
  const stageName = STAGES[(result.error_stage||1)-1]?.name || "Unknown";
  return `<div class="err-box" style="margin-top:16px"><div class="err-title">&#9888; Stage ${result.error_stage}: ${stageName}</div><div class="err-msg">${esc(result.error)}</div></div>`;
}

/* ─── FEATURE 4: Download ─── */
function downloadOutput(type) {
  if (!result?.stages?.["6"]) return;
  const t = result.stages["6"];
  const content  = type === "asm" ? t.asm : t.c_code;
  const filename = type === "asm" ? "output.asm" : "output.c";
  if (!content) return;
  const blob = new Blob([content], { type: "text/plain" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ─── FEATURE 5: Stats Dashboard ─── */
function buildStatsDashboard(sr) {
  const tokens    = sr["1"]?.tokens?.length ?? 0;
  const astNodes  = sr["2"]?.ast_nodes ?? 0;
  const symbols   = (sr["3"]?.symbols||[]).length;
  const tacBefore = (sr["4"]?.tac||[]).length;
  const elim      = sr["5"]?.eliminated ?? 0;
  const tacAfter  = (sr["5"]?.optimized_tac||[]).length;
  const reduction = tacBefore > 0 ? Math.round((elim/tacBefore)*100) : 0;

  function getMs(k) {
    const m = (sr[k]?.summary||"").match(/([\d.]+)ms/);
    return m ? parseFloat(m[1]) : 0;
  }
  const times      = [1,2,3,4,5,6].map(getMs);
  const totalMs    = times.reduce((a,b)=>a+b,0);
  const maxTime    = Math.max(...times, 1);
  const stageNames = ["Lexer","Parser","Semantic","IR Gen","Optimizer","Codegen"];
  const stageCols  = ["#7C3AED","#0EA5E9","#F97316","#EF4444","#10B981","#6366F1"];

  let h = `<div class="stats-dashboard">
    <div class="stats-dashboard-title">Compilation Stats Dashboard</div>
    <div class="stats-grid">
      <div class="dash-card"><div class="dash-card-label">Tokens</div><div class="dash-card-value" style="color:#7C3AED">${tokens}</div><div class="dash-card-sub">lexemes</div></div>
      <div class="dash-card"><div class="dash-card-label">AST Nodes</div><div class="dash-card-value" style="color:#0EA5E9">${astNodes}</div><div class="dash-card-sub">tree nodes</div></div>
      <div class="dash-card"><div class="dash-card-label">Symbols</div><div class="dash-card-value" style="color:#F97316">${symbols}</div><div class="dash-card-sub">declared</div></div>
      <div class="dash-card"><div class="dash-card-label">TAC Before</div><div class="dash-card-value" style="color:#EF4444">${tacBefore}</div><div class="dash-card-sub">instructions</div></div>
      <div class="dash-card"><div class="dash-card-label">Eliminated</div><div class="dash-card-value" style="color:#10B981">${elim}</div><div class="dash-card-sub">by optimizer</div></div>
      <div class="dash-card"><div class="dash-card-label">Reduction</div><div class="dash-card-value" style="color:#6366F1">${reduction}%</div><div class="dash-card-sub">optimized</div></div>
      <div class="dash-card"><div class="dash-card-label">Total Time</div><div class="dash-card-value" style="color:var(--text-1);font-size:15px">${totalMs.toFixed(1)}<span style="font-size:11px;color:var(--text-3)">ms</span></div><div class="dash-card-sub">end-to-end</div></div>
      <div class="dash-card"><div class="dash-card-label">Tokens/sec</div><div class="dash-card-value" style="color:var(--text-1);font-size:13px">${totalMs>0?Math.round(tokens/(totalMs/1000)).toLocaleString():'—'}</div><div class="dash-card-sub">throughput</div></div>
    </div>
    <div class="dash-bar-wrap">
      <div class="dash-bar-label">Per-stage timing</div>`;

  times.forEach((t, i) => {
    const pct = Math.round((t / maxTime) * 100);
    h += `<div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-3);margin-bottom:3px"><span>${stageNames[i]}</span><span>${t.toFixed(1)}ms</span></div>
      <div class="dash-bar-track"><div class="dash-bar-fill" style="width:0%;background:${stageCols[i]}" data-pct="${pct}"></div></div>
    </div>`;
  });

  h += `</div></div>`;

  // Trigger bar animations after render
  setTimeout(() => {
    document.querySelectorAll('.dash-bar-fill').forEach(el => {
      el.style.width = el.dataset.pct + '%';
    });
  }, 80);

  return h;
}

/* ─── FEATURE 6: AST Visual Tree ─── */
function setAstMode(mode) { astMode = mode; renderOutput(); }

function parseAstText(text) {
  const lines = text.split('\n').filter(l => l.trim());
  const root  = { label:'ROOT', attr:'', children:[], _d:-1 };
  const stack = [root];

  lines.forEach(line => {
    const indentLen = line.match(/^( *)/)[1].length;
    const depth     = Math.floor(indentLen / 2);
    const content   = line.trim();
    const pi        = content.indexOf('(');
    let label       = content, attr = '';
    if (pi !== -1) {
      label = content.slice(0, pi);
      attr  = content.slice(pi + 1, content.endsWith(')') ? content.length - 1 : undefined);
      if (attr.length > 22) attr = attr.slice(0, 22) + '\u2026';
    }
    const node = { label, attr, children:[], _d: depth };
    while (stack.length > 1 && stack[stack.length-1]._d >= depth) stack.pop();
    stack[stack.length-1].children.push(node);
    stack.push(node);
  });
  return root.children[0] || root;
}

function buildAstSvg(tree) {
  const NW = 130, NH = 40, HG = 12, VG = 56;

  function limitTree(node, maxD) {
    if (!node) return;
    node.children.forEach(c => { c._d = (node._d||0)+1; limitTree(c, maxD); });
    if ((node._d||0) >= maxD) node.children = [];
    if (node.children.length > 5) {
      const extra = node.children.length - 4;
      node.children = node.children.slice(0, 4);
      node.children.push({ label:'+'+extra+' more', attr:'', children:[], _d:(node._d||0)+1, _muted:true });
    }
  }
  limitTree(tree, 5);

  function calcLayout(node, depth, x0) {
    node._depth = depth;
    if (!node.children.length) {
      node._w  = NW + HG;
      node._cx = x0 + node._w / 2;
    } else {
      let cx = x0;
      node.children.forEach(c => { calcLayout(c, depth+1, cx); cx += c._w; });
      node._w  = cx - x0;
      node._cx = (x0 + cx) / 2;
    }
    node._cy = depth * (NH + VG) + 24;
  }
  calcLayout(tree, 0, 0);

  function maxDepth(n) {
    if (!n.children.length) return n._depth || 0;
    return Math.max(...n.children.map(maxDepth));
  }

  const svgW = Math.max(tree._w || 500, 480);
  const svgH = (maxDepth(tree)+1) * (NH + VG) + 20;

  let edgesSvg = '', nodesSvg = '';
  function traverse(node) {
    const nx = node._cx - NW/2, ny = node._cy;
    node.children.forEach(c => {
      edgesSvg += `<path d="M${node._cx},${ny+NH} C${node._cx},${ny+NH+20} ${c._cx},${c._cy-20} ${c._cx},${c._cy}" stroke="#2e2e54" stroke-width="1" fill="none"/>`;
      traverse(c);
    });
    const fill   = node._muted ? '#0e0e20' : '#181832';
    const stroke = node._muted ? '#1e1e3a' : '#2e2e54';
    const tcol   = node._muted ? '#44446a' : '#c0b0ff';
    const acol   = '#7799cc';
    nodesSvg += `<rect x="${nx}" y="${ny}" width="${NW}" height="${NH}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`;
    nodesSvg += `<text x="${node._cx}" y="${ny+16}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="${tcol}">${esc(node.label.slice(0,18))}</text>`;
    if (node.attr) nodesSvg += `<text x="${node._cx}" y="${ny+30}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8" fill="${acol}">${esc(node.attr.slice(0,20))}</text>`;
  }
  traverse(tree);

  return `<svg viewBox="0 0 ${svgW} ${svgH}" width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg" style="min-width:${svgW}px;display:block">${edgesSvg}${nodesSvg}</svg>`;
}

/* ═══════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════ */
function codeBox(title, content, color) {
  return `<div class="code-box"><div class="code-box-header"><span>${title}</span></div><div class="code-box-content" style="color:${color}">${esc(content)}</div></div>`;
}
function statsRow(items) {
  return `<div class="stats-row">${items.map(i=>`<div class="stat-chip"><strong>${esc(String(i.value))}</strong> ${esc(i.label)}</div>`).join("")}</div>`;
}
function ms(s) { if(!s) return "\u2014"; const m=s.match(/([\d.]+)ms/); return m ? m[1]+"ms" : "\u2014"; }
function setOutputTab(t) { outputTab=t; renderOutput(); }
function showLeftError(msg) {
  const el=document.getElementById("left-error");
  el.style.display="block";
  el.innerHTML=`<div class="err-box"><div class="err-msg">${esc(msg)}</div></div>`;
}
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }
